url: https://r-lib.github.io/sparsevctrs/

development:
  mode: auto

template:
  package: tidytemplate
  bootstrap: 5

  includes:
    in_header: |
      <script src="https://cdn.jsdelivr.net/gh/posit-dev/supported-by-posit/js/badge.min.js" data-max-height="43" data-light-bg="#666f76" data-light-fg="#f9f9f9"></script>
      <script defer data-domain="sparsevctrs.r-lib.org,all.tidyverse.org" src="https://plausible.io/js/plausible.js"></script>

redirects:
  - ["reference/sparse-arithmatic.html", "reference/sparse-arithmetic.html"]
  - ["reference/sparse-arithmatic-scalar.html", "reference/sparse-arithmetic-scalar.html"]

reference:
- title: Create Sparse Vectors
  contents:
  - sparse_double
  - sparse_integer
  - sparse_character
  - sparse_logical

- title: Conversion functions
  contents:
  - coerce_to_sparse_data_frame
  - coerce_to_sparse_matrix
  - coerce_to_sparse_tibble
  - coerce-vector

- title: Helper Functions
  contents:
  - sparse_mean
  - sparse_var
  - sparse_sd
  - sparse_median
  - sparse_sqrt
  - sparse_replace_na
  - sparse_is_na
  - sparse_which_na
  - sparse_lag
  - sparse_dummy
  - sparsity

- title: Utility Functions
  contents:
  - type-predicates
  - sparse-arithmetic-scalar
  - sparse-arithmetic
  - extractors
  - has_sparse_elements
  - sparsevctrs_options
